[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wilds-control"
version = "0.1.0"
description = "WILDS instrument control — FastAPI/Hypercorn backend for the WILDS spectrograph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "hypercorn>=0.17",
    "httpx[http2]>=0.27",
    "sse-starlette>=2.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "wilds-bridge",
    "wilds-solving",
    "wilds-guiding-camera",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wilds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (enforces modern Python idioms incl. PEP 585/604)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.isort]
known-first-party = ["wilds"]
