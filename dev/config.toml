# Development configuration for the VS Code launch entry (WILDS_CONTROL_CONFIG).
# Deployed copies live in $WILDS_ROOT/etc/config.toml and are never committed.
# The passphrases are in WILDS/.vault/passphrases.toml (WILDS_CONTROL_PASSPHRASES).

# development: in-process simulators, the /dev helpers; ldt-simulated: LDT's simulators (nysa) through
# the test broker (tanagra); ldt-production: the real telescope. The last two need [broker] host,
# which must agree with the mode, or wilds-control does not start.
opmode = "development"

# Where the files go is not set here: the launch entry sets WILDS_ROOT=~/wilds-dev (staging,
# the settings database and the calibration store are under its var/lib) and
# WILDS_LOIS_DATA_ROOT=~/wilds-dev/share (the "facility share"; "unplug" it by renaming the
# folder, and watch files wait). See paths.py.

[guide_camera]
kind = "simulated"
seed_simulated_calibration = true  # a slit, plate scale and orientation, so the overlay can be tried

# Real stars in the simulated guide camera: a catsHTM Gaia DR3 folder (MAST reads it from
# \\last0\catalogs\GAIA\DR3; mount that share and point to it here; needs the "catalogs" extra:
# uv sync --extra catalogs). Without it the camera draws an invented field no plate solver can match.
# The data set is the M13 field saved locally by:
#   python -m wilds.control.fetch_field /Volumes/catalogs/GAIA/DR3 data/sky/m13.npz
[sky]
field_file = "data/sky/m13.npz"
# gaia_root = "/Volumes/catalogs/GAIA/DR3"

# The plate solver the optics calibration uses. "astrometry" is wilds-solving over astrometry.net
# index files (series 5200, in $WILDS_ASTROMETRY_CACHE or ~/.astrometry); "simulated" answers from
# the simulated camera's own optics, for a machine with no index files.
[solver]
kind = "simulated"
