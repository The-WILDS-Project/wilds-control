# Development configuration for the VS Code launch entry (WILDS_CONTROL_CONFIG).
# Deployed copies live in $WILDS_ROOT/etc/config.toml and are never committed.
# The passphrases are in WILDS/.vault/passphrases.toml (WILDS_CONTROL_PASSPHRASES).

opmode = "development"  # the default; "production" refuses the /dev helpers

# Where the files go is not set here: the launch entry sets WILDS_ROOT=~/wilds-dev (staging,
# the settings database and the calibration store are under its var/lib) and
# WILDS_LOIS_DATA_ROOT=~/wilds-dev/share (the "facility share"; "unplug" it by renaming the
# folder, and watch files wait). See paths.py.
